[package]
name = "star_app"
version = "0.1.0"
edition = "2024"

[dependencies]
pingora = { version = "0.6.0", features = ["openssl"] }
pingora-core = { version = "0.6.0", features = ["openssl"] }
pingora-http = "0.6.0"
pingora-proxy = { version = "0.6.0", features = ["openssl"] }
pingora_web = "=0.1.7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
openssl = "0.10.75"

env_logger = "0.11"
log = "0.4"

constant-time-utils = { path = "../../../../constant-time-utils", default-features = false }
simple-filter-box = { path = "../../../../simple-filter-box", default-features = false, features = ["dashmap"] }
star-core = { path = "../../../core" }
star_attestation = { path = "../utils/attest", features = ["host-dcap"] }
aesm-client = { version = "0.6.2", features = ["sgxs"] }
enclave-runner = "0.8"
enclave-runner-sgx = "0.1"
sgxs-loaders = "0.5"
base64 = "0.22.1"
data-encoding = "2.10.0"
libloading = "0.8"
rand = "0.9.2"
rand_core = "0.6"
foreign-types = "0.3"
openssl-sys = "0.9"
ureq = "2"
key-manager-client = { path = "../utils/manage-key/client" }
key-manager-service = { path = "../utils/manage-key/service" }

[features]
default = []

[[bin]]
name = "star_app"
path = "src/main.rs"

[dev-dependencies]
star_tools = { path = "../tools/verifier" }
tiny_http = "0.12"
criterion = { version = "0.5", features = ["async_tokio", "html_reports"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
cpu-time = "1"
anyhow = "1"
dashmap = "6.1"

[[bench]]
name = "filter"
harness = false

[[bench]]
name = "extension"
harness = false

[[bench]]
name = "storage"
harness = false

[[bench]]
name = "tls"
harness = false

[[bench]]
name = "call"
harness = false
