[package]
name = "enclave"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[features]
default = []
bench-max-count = []

[dependencies]
rand = { version = "0.8", default-features = false, features = ["getrandom", "std", "std_rng"] }
star-core = { path = "../../../core" }
star_attestation = { path = "../utils/attest", features = ["dcap-verify"] }
hpke = { version = "0.11", default-features = false, features = ["alloc", "x25519"] }
aesm-client = "0.6.2"
sgx-isa = { version = "0.5.0", features = ["serde"] }
bincode = "1"
thiserror = "1"
